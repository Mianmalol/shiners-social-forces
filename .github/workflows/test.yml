name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      UV_NO_PROGRESS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32
      - name: Install Python and locked dependencies
        run: |
          uv python install "${{ matrix.python-version }}"
          uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - name: Run unit and synthetic-data tests
        # Fetching and Claude calls are mocked; no raw dataset or credentials needed.
        run: uv run --no-sync pytest -q
